## Mod Properties
mod_id=battlefield
mod_name=Battlefield Aircraft
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=io.github.littlebird
# Local test instance (optional). While this is set, build.gradle copies the
# reobfuscated jar here as a build finalizer, so every update reaches the client
# without any extra flag. Leave it empty to build without touching a game install.
# Windows 示例：local_mods_dir=C:/Users/<you>/AppData/Roaming/.minecraft/versions/1.20.1-forge-47.4.20/mods
# 注意：作者原配置是 WSL 路径 /mnt/c/...，在 Windows 上会被当成相对路径、凭空建出 D:\mnt\c\...，别照抄。
local_mods_dir=
mod_authors=Local learning project
mod_description=Forge 1.20.1 battlefield aircraft: BF6-style mouse-yaw helicopter flight controls, miniguns, rocket pods, guided missiles and chain gun turrets.